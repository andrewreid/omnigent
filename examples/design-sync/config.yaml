spec_version: 1
name: design-sync
description: >-
  Download-only Claude Design sync agent. Calls the local `design_sync` tool to
  download TEXT files from a claude.ai/design project into a local directory
  (exact bytes, dir structure preserved; binaries skipped). design_sync is the
  only mutation-capable tool left reachable; every other mutation-capable
  builtin (comment-update, add-policy, agent-download, cancel-task, browser
  navigate/click/type) is denied by policy; the remaining builtins are
  read-only. See README for the exact tool surface + deployment requirements.

executor:
  type: claude_sdk
  model: claude-haiku-4-5

prompt: |
  You are a download-only Claude Design sync agent. Your ONLY job: when given a
  claude.ai/design project URL, download text files to the specified output
  directory, preserving exact bytes and directory structure including the `_ds/`
  Design System tree. Binaries are skipped and reported.

  You have ONE mutation-capable tool: `design_sync(project_url, out_dir='.design-mocks', include_ds=True)`.
  Call it with the project URL. It returns a structured summary of files written,
  skipped binaries, and any failures.

  What the tool DOES touch on disk:
  - Reads `~/.claude/.credentials.json` for the auth bearer token
  - Writes the downloaded mirror under the output directory
  - Writes one `.design-sync-manifest.md` beside the output directory
  It makes no other writes.

  You NEVER:
  - Edit product code
  - Run tests, lint, typecheck, or gates
  - Open PRs or commit changes
  - Push to git

  You are a pure download orchestrator. Call the tool, report the summary, done.

async: false

# Download-only: DENY (not ASK) every mutation-capable framework tool.
# design_sync itself is intentionally NOT denied — it is the one write surface.
guardrails:
  policies:
    deny_all_mutations:
      type: function
      function:
        path: omnigent.policies.function.make_fixed_action_callable
        arguments:
          action: deny
          reason: "download-only agent: mutations disabled"
          on_phases: [tool_call]
          on_tools:
            # Registered mutation-capable builtins (audited across all 19 tools).
            - update_comment       # changes a review comment's persisted state
            - sys_add_policy       # creates a new session policy
            - sys_agent_download   # writes bundle bytes to disk (arbitrary write)
            - sys_cancel_task      # POSTs stop/interrupt → mutates task lifecycle
            - browser_navigate     # drives external browser page/URL
            - browser_click        # mutates page/UI state
            - browser_type         # fires input/change events on the page
            # Belt-and-suspenders: OS tools are NOT registered (no os_env block),
            # but deny them anyway so a future os_env addition can't silently
            # re-open a write/edit/shell surface.
            - sys_os_write
            - sys_os_edit
            - sys_os_shell
