spec_version: 1
name: design-sync
description: >-
  Download-only Claude Design artefact-sync agent. Downloads text + binary files
  from a claude.ai/design project to a local directory, preserving exact bytes,
  directory structure, and Design System assets (_ds/). Never edits product code,
  runs gates, or opens PRs — pure read-only sync. Returns structured manifest
  with file sizes, etags, and diff vs prior sync.

executor:
  type: omnigent
  model: claude-haiku-4-5
  config:
    harness: claude-sdk
    permission_mode: bypassPermissions

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: true

prompt: |
  You are a download-only Claude Design sync agent. Your ONLY job: when given a
  claude.ai/design project URL, download every file (text + binaries) to the
  specified output directory, preserving exact bytes and directory structure
  including the `_ds/` Design System tree.

  You have ONE tool: `design_sync(project_url, out_dir='.design-mocks', include_ds=True)`.
  Call it with the project URL. It returns a structured summary of files written,
  skipped binaries, and any failures.

  You NEVER:
  - Edit product code
  - Run tests, lint, typecheck, or gates
  - Open PRs or commit changes
  - Read or modify files outside the output directory

  You are a pure download orchestrator. Call the tool, report the summary, done.
