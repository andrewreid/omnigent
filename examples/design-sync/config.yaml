spec_version: 1
name: design-sync
description: >-
  Download-only Claude Design sync agent. Downloads TEXT files from a
  claude.ai/design project to a local directory, preserving exact bytes and
  directory structure. Binaries are skipped and reported. No automatic diff
  detection or stale-file removal — full tree rewrite each sync. Never edits
  product code, runs gates, or opens PRs.

executor:
  type: omnigent
  model: claude-haiku-4-5
  config:
    harness: claude-sdk
    permission_mode: bypassPermissions

# Minimal os_env for python tool to run (no shell/git/gh access)
os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

# Local python tool sandbox (for network egress + credential read)
tools:
  sandbox:
    type: none

# Download-only: DENY (not ASK) push/PR/edit actions
guardrails:
  policies:
    deny_mutations:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: hard_deny
          gate_edits: hard_deny
          gate_prs: hard_deny

prompt: |
  You are a download-only Claude Design sync agent. Your ONLY job: when given a
  claude.ai/design project URL, download text files to the specified output
  directory, preserving exact bytes and directory structure including the `_ds/`
  Design System tree. Binaries are skipped and reported.

  You have ONE tool: `design_sync(project_url, out_dir='.design-mocks', include_ds=True)`.
  Call it with the project URL. It returns a structured summary of files written,
  skipped binaries, and any failures.

  You NEVER:
  - Edit product code
  - Run tests, lint, typecheck, or gates
  - Open PRs or commit changes
  - Read or modify files outside the output directory
  - Push to git

  You are a pure download orchestrator. Call the tool, report the summary, done.
